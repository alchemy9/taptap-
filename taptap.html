<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapTap - 发现好游戏</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300d6e6'/%3E%3Ctext x='32' y='44' font-size='28' font-weight='bold' text-anchor='middle' fill='%23111'%3ET%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #111111; color: #fff; min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }
  img { display: block; max-width: 100%; }

  /* ===== 顶部导航 ===== */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(17,17,17,0.92); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav-inner {
    max-width: 1400px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; height: 56px; gap: 24px;
  }
  .logo { font-size: 22px; font-weight: 800; color: #00d6e6; letter-spacing: -0.5px; flex-shrink: 0; cursor: pointer; }
  .logo span { color: #fff; }
  .nav-categories { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; -ms-overflow-style: none; }
  .nav-categories::-webkit-scrollbar { display: none; }
  .nav-cat {
    padding: 6px 14px; border-radius: 16px; font-size: 14px; color: #aaa;
    white-space: nowrap; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
  }
  .nav-cat:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .nav-cat.active { color: #00d6e6; background: rgba(0,214,230,0.1); font-weight: 500; }
  .nav-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .search-box {
    display: flex; align-items: center; background: rgba(255,255,255,0.08);
    border-radius: 20px; padding: 6px 14px; gap: 8px; cursor: pointer; transition: background 0.2s;
  }
  .search-box:hover { background: rgba(255,255,255,0.14); }
  .search-box svg { width: 16px; height: 16px; fill: #888; }
  .search-box span { font-size: 13px; color: #888; }
  .btn-login {
    padding: 7px 20px; border-radius: 20px; background: #00d6e6; color: #111;
    font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: opacity 0.2s;
  }
  .btn-login:hover { opacity: 0.85; }

  /* ===== 视图切换 ===== */
  .view { display: none; }
  .view.active { display: block; }

  /* ===== Hero 轮播（首页） ===== */
  .hero-section { margin-top: 56px; position: relative; width: 100%; overflow: hidden; }
  .hero-slider { position: relative; width: 100%; height: 520px; }
  .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
  .hero-slide.active { opacity: 1; pointer-events: auto; }
  .hero-slide img { width: 100%; height: 100%; object-fit: cover; }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(17,17,17,0.9) 0%, rgba(17,17,17,0.5) 50%, transparent 100%);
    display: flex; align-items: center; padding: 0 60px;
  }
  .hero-info { max-width: 560px; }
  .hero-tag {
    display: inline-block; padding: 4px 12px; background: rgba(0,214,230,0.15);
    color: #00d6e6; border-radius: 4px; font-size: 12px; font-weight: 600; margin-bottom: 16px; letter-spacing: 1px;
  }
  .hero-title { font-size: 36px; font-weight: 800; line-height: 1.3; margin-bottom: 12px; }
  .hero-desc { font-size: 15px; color: #bbb; line-height: 1.7; margin-bottom: 24px; }
  .hero-btn {
    display: inline-block; padding: 10px 28px; border: 1px solid rgba(255,255,255,0.4);
    border-radius: 24px; font-size: 14px; color: #fff; cursor: pointer; transition: all 0.2s; background: transparent;
  }
  .hero-btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; }
  .hero-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
    border-radius: 50%; background: rgba(0,0,0,0.4); border: none; color: #fff; cursor: pointer;
    z-index: 10; display: flex; align-items: center; justify-content: center; transition: background 0.2s;
  }
  .hero-arrow:hover { background: rgba(0,0,0,0.7); }
  .hero-arrow.prev { left: 20px; }
  .hero-arrow.next { right: 20px; }
  .hero-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  .hero-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s; }
  .hero-dot.active { background: #00d6e6; width: 24px; border-radius: 4px; }

  /* ===== 内容区 ===== */
  .container { max-width: 1400px; margin: 0 auto; padding: 32px 24px 60px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .section-title { font-size: 20px; font-weight: 700; }
  .section-more { font-size: 13px; color: #888; cursor: pointer; transition: color 0.2s; }
  .section-more:hover { color: #00d6e6; }

  /* ===== 游戏卡片网格 ===== */
  .game-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .game-card {
    background: #1a1a1a; border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .game-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
  .game-cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .game-info { padding: 12px; display: flex; gap: 10px; align-items: flex-start; }
  .game-icon { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .game-text { flex: 1; min-width: 0; }
  .game-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game-desc { font-size: 12px; color: #888; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .game-rating { font-size: 18px; font-weight: 700; color: #00d6e6; flex-shrink: 0; }

  /* ===== 游戏详情页 ===== */
  .detail-hero {
    margin-top: 56px; position: relative; height: 420px; overflow: hidden;
  }
  .detail-hero img { width: 100%; height: 100%; object-fit: cover; }
  .detail-hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(17,17,17,0.3) 0%, rgba(17,17,17,0.95) 100%);
  }
  .detail-back {
    position: absolute; top: 72px; left: 24px; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 20px;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 14px;
    cursor: pointer; transition: background 0.2s; border: none;
  }
  .detail-back:hover { background: rgba(0,0,0,0.7); }
  .detail-body { max-width: 1000px; margin: -80px auto 0; padding: 0 24px 60px; position: relative; z-index: 5; }
  .detail-head { display: flex; gap: 20px; align-items: flex-end; margin-bottom: 24px; }
  .detail-icon {
    width: 120px; height: 120px; border-radius: 24px; object-fit: cover;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); flex-shrink: 0;
  }
  .detail-head-info { flex: 1; padding-bottom: 8px; }
  .detail-name { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .detail-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .detail-tag {
    padding: 4px 12px; background: rgba(255,255,255,0.1); border-radius: 4px;
    font-size: 12px; color: #aaa;
  }
  .detail-score-box {
    text-align: center; padding: 12px 20px; background: rgba(0,214,230,0.1);
    border-radius: 12px; border: 1px solid rgba(0,214,230,0.2);
  }
  .detail-score { font-size: 36px; font-weight: 800; color: #00d6e6; line-height: 1; }
  .detail-score-label { font-size: 12px; color: #888; margin-top: 4px; }
  .detail-desc-block {
    background: #1a1a1a; border-radius: 12px; padding: 24px; margin-bottom: 20px;
  }
  .detail-desc-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .detail-desc-text { font-size: 14px; color: #bbb; line-height: 1.8; }
  .detail-actions { display: flex; gap: 12px; margin-bottom: 24px; }
  .btn-download {
    flex: 1; padding: 14px; border-radius: 24px; background: #00d6e6;
    color: #111; font-size: 16px; font-weight: 700; border: none; cursor: pointer;
    transition: opacity 0.2s; text-align: center;
  }
  .btn-download:hover { opacity: 0.85; }
  .btn-follow {
    padding: 14px 32px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.3);
    background: transparent; color: #fff; font-size: 14px; cursor: pointer; transition: all 0.2s;
  }
  .btn-follow:hover { background: rgba(255,255,255,0.1); }
  .detail-screenshots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .detail-screenshots img {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; cursor: pointer;
    transition: transform 0.2s;
  }
  .detail-screenshots img:hover { transform: scale(1.02); }
  .detail-related { margin-top: 32px; }
  .detail-related h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  @media (max-width: 600px) {
    .detail-head { flex-wrap: wrap; }
    .detail-icon { width: 80px; height: 80px; border-radius: 16px; }
    .detail-name { font-size: 22px; }
    .detail-score { font-size: 28px; }
    .detail-screenshots { grid-template-columns: repeat(2, 1fr); }
  }

  /* ===== 底部 ===== */
  .footer { border-top: 1px solid rgba(255,255,255,0.06); padding: 32px 24px; text-align: center; color: #555; font-size: 13px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: rgba(0,0,0,0.85); color: #fff; padding: 10px 24px; border-radius: 24px;
    font-size: 14px; z-index: 9999; transition: transform 0.3s; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== 响应式 ===== */
  @media (max-width: 1200px) { .game-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 900px) {
    .game-grid { grid-template-columns: repeat(3, 1fr); }
    .hero-slider { height: 360px; }
    .hero-overlay { padding: 0 24px; }
    .hero-title { font-size: 26px; }
    .search-box span { display: none; }
  }
  @media (max-width: 600px) {
    .game-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .hero-slider { height: 260px; }
    .hero-title { font-size: 20px; }
    .hero-desc { font-size: 13px; margin-bottom: 16px; }
    .nav-inner { padding: 0 12px; gap: 12px; }
    .container { padding: 20px 12px 40px; }
  }
</style>
</head>
<body>

<nav class="navbar">

<!-- ===== 视图：首页 ===== -->
<div class="view active" id="view-home">
  <section class="hero-section">
    <div class="hero-slider" id="heroSlider"></div>
    <button class="hero-arrow prev" onclick="changeSlide(-1)" aria-label="上一张">

<script>
// ===== 图片本地路径 =====
const IMG = {
  lvdongCover: 'assets/game-lvdong-cover.jpg',
  lvdongIcon: 'assets/game-lvdong-icon.jpg',
  eipiaoCover: 'assets/game-eipiao-cover.jpg',
  eipiaoIcon: 'assets/game-eipiao-icon.jpg',
  orzmicCover: 'assets/game-orzmic-cover.jpg',
  orzmicIcon: 'assets/game-orzmic-icon.jpg',
  tongbuCover: 'assets/game-tongbu-cover.jpg',
  tongbuIcon: 'assets/game-tongbu-icon.jpg',
  dongwuCover: 'assets/game-dongwu-cover.jpg',
  dongwuIcon: 'assets/game-dongwu-icon.jpg',
  yongyanCover: 'assets/game-yongyan-cover.jpg',
  yongyanIcon: 'assets/game-yongyan-icon.jpg',
  xiangchangCover: 'assets/game-xiangchang-cover.jpg',
  xiangchangIcon: 'assets/game-xiangchang-icon.jpg',
  tankeCover: 'assets/game-tanke-cover.jpg',
  tankeIcon: 'assets/game-tanke-icon.jpg',
  ditieCover: 'assets/game-ditie-cover.jpg',
  ditieIcon: 'assets/game-ditie-icon.jpg',
};

// ===== 游戏数据（含 slug 用于路由） =====
const games = [
  { slug: 'eipiao', icon: IMG.eipiaoIcon, cover: IMG.eipiaoCover, name: '饿殍：明末千里行',
    desc: '"岁大饥，人相食。" 明末叙事冒险', rating: '9.7',
    tags: ['叙事', '单机', '国风', '视觉小说'],
    longDesc: '"岁大饥，人相食。" ——《明史》。一款以明末灾荒为背景的叙事冒险游戏。跟随少女满穗踏上千里求生之路，在饥荒与战乱中见证人性的光辉与阴暗。游戏以黑白水墨画风呈现，剧情深刻动人。' },
  { slug: 'lvdong', icon: IMG.lvdongIcon, cover: IMG.lvdongCover, name: '律动轨迹',
    desc: '周年版本登场，全新曲目与剧情', rating: '9.1',
    tags: ['音游', '二次元', '节奏'],
    longDesc: '律动轨迹周年版本登场！全新剧情、曲目与角色皮肤等你来体验。一款融合二次元画风与音乐节奏的创新音游，独特的谱面设计与动听的原创曲目。' },
  { slug: 'tongbu', icon: IMG.tongbuIcon, cover: IMG.tongbuCover, name: '同步音律',
    desc: '萌萌音游，尽享不同风格独立音乐', rating: '9.1',
    tags: ['音游', '独立', '音乐'],
    longDesc: '萌萌音游，尽享不同风格独立音乐。多角色、多曲风，节奏冒险启程。收录大量独立音乐人的原创曲目，画风可爱，适合各年龄段玩家。' },
  { slug: 'dongwu', icon: IMG.dongwuIcon, cover: IMG.dongwuCover, name: '动物餐厅',
    desc: '与Q萌动物，共造美妙餐厅', rating: '8.6',
    tags: ['治愈', '经营', '放置'],
    longDesc: '与Q萌动物，共造美妙餐厅。经营一家温暖的小动物主题餐厅，收集各种可爱的动物客人，制作美食，装饰店面。轻松治愈的放置类经营游戏。' },
  { slug: 'xiangchang', icon: IMG.xiangchangIcon, cover: IMG.xiangchangCover, name: '香肠派对',
    desc: 'SS27赛季：创造与破坏', rating: '8.6',

    longDesc: 'SS27赛季：创造与破坏。全新玩法赛季开启，香肠人战场等你来战！一款卡通风格的大逃杀射击游戏，搞怪有趣，支持多人组队开黑。' },
  { slug: 'orzmic', icon: IMG.orzmicIcon, cover: IMG.orzmicCover, name: 'Orzmic',
    desc: '音游 · 二次元 · 单机', rating: '8.5',
    tags: ['音游', '二次元', '单机'],
    longDesc: 'Circle, Line, Neon and Music. 一款独特视觉风格的原创音游。暗黑霓虹美术风格，创新的轨道式按键设计，收录多首高质量原创曲。' },
  { slug: 'yongyan', icon: IMG.yongyanIcon, cover: IMG.yongyanCover, name: '永不言弃2',
    desc: '跳进水墨世界，跟随节奏跳跃', rating: '7.2',
    tags: ['音游', '跳跃', '虐心'],
    longDesc: '跳进水墨世界，跟随节奏跳过千难万险。经典节奏跳跃游戏续作，更虐心的关卡设计，更带感的音乐，挑战你的反应极限。' },
  { slug: 'ditie', icon: IMG.ditieIcon, cover: IMG.ditieCover, name: '地铁跑酷',
    desc: '重返千年神都洛阳，穿梭山海奇境', rating: '6.9',
    tags: ['跑酷', '休闲', '国风'],
    longDesc: '重返千年神都洛阳，穿梭山海奇境！全新国风版本上线。经典跑酷游戏，躲避警察追击，收集金币，解锁新角色和滑板。' },
  { slug: 'tanke', icon: IMG.tankeIcon, cover: IMG.tankeCover, name: '坦克世界闪击战',
    desc: '战车竞技扛鼎之作，技术与策略', rating: '6.4',
    tags: ['战车', '竞技', '军事'],
    longDesc: '战车竞技扛鼎之作，技术与策略的双重考验。指挥钢铁洪流，驾驶历史名坦参加7v7实时对战。超过200辆经典战车可供收集与升级。' },

// ===== Hero 轮播数据 =====
const slides = games.map(g => ({
  cover: g.cover, tag: g.tags[0], title: g.name, desc: g.desc, slug: g.slug
}));

// ===== 路由 =====
function navigate(hash) { location.hash = hash; }

function router() {
  const hash = location.hash || '#/';
  const parts = hash.split('/').filter(Boolean);

  // 首页
  if (parts.length === 1 && parts[0] === '#') {
    showView('view-home');
    document.title = 'TapTap - 发现好游戏';
    window.scrollTo(0, 0);
    return;
  }

  // 游戏详情：#/game/eipiao
  if (parts[1] === 'game') {
    const slug = parts[2];
    const game = games.find(g => g.slug === slug);
    if (game) {
      renderDetail(game);
      showView('view-detail');
      document.title = game.name + ' - TapTap';
      window.scrollTo(0, 0);
      return;
    }
  }

  // 兜底回首页
  showView('view-home');
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== 渲染 Hero =====
let currentSlide = 0;
let slideTimer;

function renderHero() {
  const slider = document.getElementById('heroSlider');
  const dots = document.getElementById('heroDots');
  slider.innerHTML = slides.map((s, i) => `
    <div class="hero-slide ${i === 0 ? 'active' : ''}" data-index="${i}">
      <img src="${s.cover}" alt="${s.title}">
      <div class="hero-overlay">
        <div class="hero-info">
          <div class="hero-tag">${s.tag}</div>
          <h2 class="hero-title">${s.title}</h2>
          <p class="hero-desc">${s.desc}</p>
          <button class="hero-btn" onclick="navigate('#/game/${s.slug}')">立即查看</button>
        </div>
      </div>
    </div>
  `).join('');
  dots.innerHTML = slides.map((_, i) =>
    `<div class="hero-dot ${i === 0 ? 'active' : ''}" data-index="${i}" onclick="goToSlide(${i})"></div>`
  ).join('');
}

function changeSlide(dir) {
  currentSlide = (currentSlide + dir + slides.length) % slides.length;
  updateSlide();
}
function goToSlide(i) { currentSlide = i; updateSlide(); }
function updateSlide() {
  document.querySelectorAll('.hero-slide').forEach((el, i) => el.classList.toggle('active', i === currentSlide));
  document.querySelectorAll('.hero-dot').forEach((el, i) => el.classList.toggle('active', i === currentSlide));
}

function startAutoSlide() {
  clearInterval(slideTimer);
  slideTimer = setInterval(() => changeSlide(1), 5000);
}

// ===== 渲染游戏卡片 =====
function renderGames() {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = games.map(g => `
    <div class="game-card" onclick="navigate('#/game/${g.slug}')">
      <img class="game-cover" src="${g.cover}" alt="${g.name}">
      <div class="game-info">
        <img class="game-icon" src="${g.icon}" alt="${g.name}图标">
        <div class="game-text">
          <div class="game-name">${g.name}</div>
          <div class="game-desc">${g.desc}</div>
        </div>
        <div class="game-rating">${g.rating}</div>
      </div>
    </div>
  `).join('');
}

// ===== 渲染游戏详情页 =====
function renderDetail(game) {
  const related = games.filter(g => g.slug !== game.slug).slice(0, 4);
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-hero">
      <img src="${game.cover}" alt="${game.name}">
      <button class="detail-back" onclick="navigate('#/')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        返回
      </button>
    </div>
    <div class="detail-body">
      <div class="detail-head">
        <img class="detail-icon" src="${game.icon}" alt="${game.name}">
        <div class="detail-head-info">
          <div class="detail-name">${game.name}</div>
          <div class="detail-tags">
            ${game.tags.map(t => `<span class="detail-tag">${t}</span>`).join('')}
          </div>
        </div>
        <div class="detail-score-box">
          <div class="detail-score">${game.rating}</div>
          <div class="detail-score-label">TapTap 评分</div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn-download" onclick="showToast('开始下载「${game.name}」演示')">下载游戏</button>
        <button class="btn-follow" onclick="showToast('已关注「${game.name}」')">+ 关注</button>
      </div>
      <div class="detail-desc-block">
        <div class="detail-desc-title">游戏介绍</div>
        <p class="detail-desc-text">${game.longDesc}</p>
      </div>
      <div class="detail-desc-block">
        <div class="detail-desc-title">游戏截图</div>
        <div class="detail-screenshots">
          <img src="${game.cover}" alt="截图1" onclick="showToast('查看大图演示')">
          <img src="${game.icon}" alt="截图2" onclick="showToast('查看大图演示')">
          <img src="${game.cover}" alt="截图3" onclick="showToast('查看大图演示')">
        </div>
      </div>
      <div class="detail-related">
        <h3>相关推荐</h3>
        <div class="game-grid" style="grid-template-columns: repeat(4, 1fr);">
          ${related.map(g => `
            <div class="game-card" onclick="navigate('#/game/${g.slug}')">
              <img class="game-cover" src="${g.cover}" alt="${g.name}">
              <div class="game-info">
                <img class="game-icon" src="${g.icon}" alt="${g.name}">
                <div class="game-text">
                  <div class="game-name">${g.name}</div>
                  <div class="game-rating" style="font-size:16px;">${g.rating}</div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

// ===== 导航分类点击 =====
document.getElementById('navCats').addEventListener('click', (e) => {
  const cat = e.target.closest('.nav-cat');
  if (!cat) return;
  document.querySelectorAll('.nav-cat').forEach(c => c.classList.remove('active'));
  cat.classList.add('active');
  showToast('分类：' + cat.textContent);
  navigate('#/');
});

// ===== Toast =====
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 路由监听 =====
window.addEventListener('hashchange', router);

// ===== 初始化 =====
renderHero();
renderGames();
router();
startAutoSlide();
</script>
</body>
</html>
