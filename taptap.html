<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapTap - 发现好游戏</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300d6e6'/%3E%3Ctext x='32' y='44' font-size='28' font-weight='bold' text-anchor='middle' fill='%23111'%3ET%3C/text%3E%3C/svg%3E">
<style>
  /* ===== 重置与基础 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #111111;
    color: #fff;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }
  img { display: block; max-width: 100%; }

  /* ===== 顶部导航 ===== */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(17,17,17,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 56px;
    gap: 24px;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    color: #00d6e6;
    letter-spacing: -0.5px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .logo span { color: #fff; }
  .nav-categories {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .nav-categories::-webkit-scrollbar { display: none; }
  .nav-cat {
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 14px;
    color: #aaa;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .nav-cat:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .nav-cat.active {
    color: #00d6e6;
    background: rgba(0,214,230,0.1);
    font-weight: 500;
  }
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 6px 14px;
    gap: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .search-box:hover { background: rgba(255,255,255,0.14); }
  .search-box svg { width: 16px; height: 16px; fill: #888; }
  .search-box span { font-size: 13px; color: #888; }
  .btn-login {
    padding: 7px 20px;
    border-radius: 20px;
    background: #00d6e6;
    color: #111;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-login:hover { opacity: 0.85; }

  /* ===== Hero 轮播 ===== */
  .hero-section {
    margin-top: 56px;
    position: relative;
    width: 100%;
    overflow: hidden;
  }
  .hero-slider {
    position: relative;
    width: 100%;
    height: 520px;
  }
  .hero-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .hero-slide.active {
    opacity: 1;
    pointer-events: auto;
  }
  .hero-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(17,17,17,0.9) 0%, rgba(17,17,17,0.5) 50%, transparent 100%);
    display: flex;
    align-items: center;
    padding: 0 60px;
  }
  .hero-info { max-width: 560px; }
  .hero-tag {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(0,214,230,0.15);
    color: #00d6e6;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .hero-title {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .hero-desc {
    font-size: 15px;
    color: #bbb;
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .hero-btn {
    display: inline-block;
    padding: 10px 28px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 24px;
    font-size: 14px;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
  }
  .hero-btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; }
  .hero-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .hero-arrow:hover { background: rgba(0,0,0,0.7); }
  .hero-arrow.prev { left: 20px; }
  .hero-arrow.next { right: 20px; }
  .hero-dots {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .hero-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
    transition: all 0.3s;
  }
  .hero-dot.active {
    background: #00d6e6;
    width: 24px;
    border-radius: 4px;
  }

  /* ===== 内容区 ===== */
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 20px;
    font-weight: 700;
  }
  .section-more {
    font-size: 13px;
    color: #888;
    cursor: pointer;
    transition: color 0.2s;
  }
  .section-more:hover { color: #00d6e6; }

  /* ===== 游戏卡片网格 ===== */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
  }
  .game-card {
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .game-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .game-cover {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
  }
  .game-info {
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .game-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .game-text { flex: 1; min-width: 0; }
  .game-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .game-desc {
    font-size: 12px;
    color: #888;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .game-rating {
    font-size: 18px;
    font-weight: 700;
    color: #00d6e6;
    flex-shrink: 0;
  }

  /* ===== 底部 ===== */
  .footer {
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 32px 24px;
    text-align: center;
    color: #555;
    font-size: 13px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 9999;
    transition: transform 0.3s;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== 响应式 ===== */
  @media (max-width: 1200px) {
    .game-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 900px) {
    .game-grid { grid-template-columns: repeat(3, 1fr); }
    .hero-slider { height: 360px; }
    .hero-overlay { padding: 0 24px; }
    .hero-title { font-size: 26px; }
    .search-box span { display: none; }
  }
  @media (max-width: 600px) {
    .game-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .hero-slider { height: 260px; }
    .hero-title { font-size: 20px; }
    .hero-desc { font-size: 13px; margin-bottom: 16px; }
    .nav-inner { padding: 0 12px; gap: 12px; }
    .container { padding: 20px 12px 40px; }
  }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<nav class="navbar">
  <div class="nav-inner">
    <div class="logo" onclick="showToast('TapTap 首页')">Tap<span>Tap</span></div>
    <div class="nav-categories" id="navCats">
      <div class="nav-cat active" data-cat="recommend">为你推荐</div>
      <div class="nav-cat" data-cat="new">新版本</div>
      <div class="nav-cat" data-cat="card">卡牌</div>
      <div class="nav-cat" data-cat="shoot">射击</div>
      <div class="nav-cat" data-cat="acg">二次元</div>
      <div class="nav-cat" data-cat="roguelike">Roguelike</div>
      <div class="nav-cat" data-cat="puzzle">解谜</div>
      <div class="nav-cat" data-cat="music">音游</div>
      <div class="nav-cat" data-cat="female">女性向</div>
      <div class="nav-cat" data-cat="casual">养成</div>
      <div class="nav-cat" data-cat="sandbox">沙盒</div>
      <div class="nav-cat" data-cat="openworld">开放世界</div>
      <div class="nav-cat" data-cat="mmo">MMORPG</div>
      <div class="nav-cat" data-cat="wuxia">武侠</div>
      <div class="nav-cat" data-cat="chinese">国风</div>
      <div class="nav-cat" data-cat="racing">竞速</div>
      <div class="nav-cat" data-cat="steam">Steam移植</div>
      <div class="nav-cat" data-cat="survival">生存</div>
      <div class="nav-cat" data-cat="moba">MOBA</div>
      <div class="nav-cat" data-cat="tower">塔防</div>
      <div class="nav-cat" data-cat="pixel">像素</div>
      <div class="nav-cat" data-cat="heal">治愈</div>
    </div>
    <div class="nav-actions">
      <div class="search-box" onclick="showToast('搜索功能演示')">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>搜索游戏、攻略、UP主</span>
      </div>
      <button class="btn-login" onclick="showToast('登录/注册演示')">登录</button>
    </div>
  </div>
</nav>

<!-- ===== Hero 轮播 ===== -->
<section class="hero-section">
  <div class="hero-slider" id="heroSlider">
    <!-- slides injected by JS -->
  </div>
  <button class="hero-arrow prev" onclick="changeSlide(-1)" aria-label="上一张">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <button class="hero-arrow next" onclick="changeSlide(1)" aria-label="下一张">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>
  <div class="hero-dots" id="heroDots"></div>
</section>

<!-- ===== 游戏推荐 ===== -->
<div class="container">
  <div class="section-header">
    <h2 class="section-title">编辑推荐</h2>
    <span class="section-more" onclick="showToast('查看更多演示')">查看更多 &gt;</span>
  </div>
  <div class="game-grid" id="gameGrid">
    <!-- cards injected by JS -->
  </div>
</div>

<!-- ===== 底部 ===== -->
<footer class="footer">
  <p>TapTap 复刻演示页 · 仅用于学习展示 · 图片版权归原作者所有</p>
</footer>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== 图片本地路径 =====
const IMG = {
  lvdongCover: 'assets/game-lvdong-cover.jpg',
  lvdongIcon: 'assets/game-lvdong-icon.jpg',
  eipiaoCover: 'assets/game-eipiao-cover.jpg',
  eipiaoIcon: 'assets/game-eipiao-icon.jpg',
  orzmicCover: 'assets/game-orzmic-cover.jpg',
  orzmicIcon: 'assets/game-orzmic-icon.jpg',
  tongbuCover: 'assets/game-tongbu-cover.jpg',
  tongbuIcon: 'assets/game-tongbu-icon.jpg',
  dongwuCover: 'assets/game-dongwu-cover.jpg',
  dongwuIcon: 'assets/game-dongwu-icon.jpg',
  yongyanCover: 'assets/game-yongyan-cover.jpg',
  yongyanIcon: 'assets/game-yongyan-icon.jpg',
  xiangchangCover: 'assets/game-xiangchang-cover.jpg',
  xiangchangIcon: 'assets/game-xiangchang-icon.jpg',
  tankeCover: 'assets/game-tanke-cover.jpg',
  tankeIcon: 'assets/game-tanke-icon.jpg',
  ditieCover: 'assets/game-ditie-cover.jpg',
  ditieIcon: 'assets/game-ditie-icon.jpg',
};

// ===== Hero 轮播数据 =====
const slides = [
  {
    cover: IMG.eipiaoCover,
    tag: '编辑推荐',
    title: '饿殍：明末千里行',
    desc: '"岁大饥，人相食。" —— 《明史》。一款以明末灾荒为背景的叙事冒险游戏，跟随少女满穗踏上千里求生之路。',
  },
  {
    cover: IMG.lvdongCover,
    tag: '二周年',
    title: '律动轨迹',
    desc: '律动轨迹周年版本登场！全新剧情、曲目与角色皮肤等你来体验。',
  },
  {
    cover: IMG.orzmicCover,
    tag: '音游',
    title: 'Orzmic',
    desc: 'Circle, Line, Neon and Music. 一款独特视觉风格的原创音游，二次元·单机。',
  },
  {
    cover: IMG.tongbuCover,
    tag: '音游',
    title: '同步音律',
    desc: '萌萌音游，尽享不同风格独立音乐。多角色、多曲风，节奏冒险启程。',
  },
  {
    cover: IMG.dongwuCover,
    tag: '治愈',
    title: '动物餐厅',
    desc: '与Q萌动物，共造美妙餐厅。经营一家温暖的小动物主题餐厅。',
  },
  {
    cover: IMG.yongyanCover,
    tag: '音游',
    title: '永不言弃2',
    desc: '跳进水墨世界，跟随节奏跳过千难万险。经典节奏跳跃游戏续作。',
  },
  {
    cover: IMG.xiangchangCover,
    tag: '射击',
    title: '香肠派对',
    desc: 'SS27赛季：创造与破坏。全新玩法赛季开启，香肠人战场等你来战！',
  },
  {
    cover: IMG.tankeCover,
    tag: '战车竞技',
    title: '坦克世界闪击战',
    desc: '战车竞技扛鼎之作，技术与策略的双重考验。指挥钢铁洪流！',
  },
  {
    cover: IMG.ditieCover,
    tag: '跑酷',
    title: '地铁跑酷',
    desc: '重返千年神都洛阳，穿梭山海奇境！全新国风版本上线。',
  },
];

// ===== 游戏卡片数据 =====
const games = [
  { icon: IMG.eipiaoIcon, cover: IMG.eipiaoCover, name: '饿殍：明末千里行', desc: '"岁大饥，人相食。" 明末叙事冒险', rating: '9.7' },
  { icon: IMG.lvdongIcon, cover: IMG.lvdongCover, name: '律动轨迹', desc: '周年版本登场，全新曲目与剧情', rating: '9.1' },
  { icon: IMG.tongbuIcon, cover: IMG.tongbuCover, name: '同步音律', desc: '萌萌音游，尽享不同风格独立音乐', rating: '9.1' },
  { icon: IMG.dongwuIcon, cover: IMG.dongwuCover, name: '动物餐厅', desc: '与Q萌动物，共造美妙餐厅', rating: '8.6' },
  { icon: IMG.xiangchangIcon, cover: IMG.xiangchangCover, name: '香肠派对', desc: 'SS27赛季：创造与破坏', rating: '8.6' },
  { icon: IMG.orzmicIcon, cover: IMG.orzmicCover, name: 'Orzmic', desc: '音游 · 二次元 · 单机', rating: '8.5' },
  { icon: IMG.yongyanIcon, cover: IMG.yongyanCover, name: '永不言弃2', desc: '跳进水墨世界，跟随节奏跳跃', rating: '7.2' },
  { icon: IMG.ditieIcon, cover: IMG.ditieCover, name: '地铁跑酷', desc: '重返千年神都洛阳，穿梭山海奇境', rating: '6.9' },
  { icon: IMG.tankeIcon, cover: IMG.tankeCover, name: '坦克世界闪击战', desc: '战车竞技扛鼎之作，技术与策略', rating: '6.4' },
];

// ===== 渲染 Hero =====
let currentSlide = 0;
function renderHero() {
  const slider = document.getElementById('heroSlider');
  const dots = document.getElementById('heroDots');
  slider.innerHTML = slides.map((s, i) => `
    <div class="hero-slide ${i === 0 ? 'active' : ''}" data-index="${i}">
      <img src="${s.cover}" alt="${s.title}">
      <div class="hero-overlay">
        <div class="hero-info">
          <div class="hero-tag">${s.tag}</div>
          <h2 class="hero-title">${s.title}</h2>
          <p class="hero-desc">${s.desc}</p>
          <button class="hero-btn" onclick="showToast('进入「${s.title}」详情页演示')">立即查看</button>
        </div>
      </div>
    </div>
  `).join('');
  dots.innerHTML = slides.map((_, i) =>
    `<div class="hero-dot ${i === 0 ? 'active' : ''}" data-index="${i}" onclick="goToSlide(${i})"></div>`
  ).join('');
}

function changeSlide(dir) {
  currentSlide = (currentSlide + dir + slides.length) % slides.length;
  updateSlide();
}
function goToSlide(i) {
  currentSlide = i;
  updateSlide();
}
function updateSlide() {
  document.querySelectorAll('.hero-slide').forEach((el, i) => {
    el.classList.toggle('active', i === currentSlide);
  });
  document.querySelectorAll('.hero-dot').forEach((el, i) => {
    el.classList.toggle('active', i === currentSlide);
  });
}

// 自动轮播
let slideTimer = setInterval(() => changeSlide(1), 5000);

// ===== 渲染游戏卡片 =====
function renderGames() {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = games.map(g => `
    <div class="game-card" onclick="showToast('查看「${g.name}」详情')">
      <img class="game-cover" src="${g.cover}" alt="${g.name}">
      <div class="game-info">
        <img class="game-icon" src="${g.icon}" alt="${g.name}图标">
        <div class="game-text">
          <div class="game-name">${g.name}</div>
          <div class="game-desc">${g.desc}</div>
        </div>
        <div class="game-rating">${g.rating}</div>
      </div>
    </div>
  `).join('');
}

// ===== 导航分类点击 =====
document.getElementById('navCats').addEventListener('click', (e) => {
  const cat = e.target.closest('.nav-cat');
  if (!cat) return;
  document.querySelectorAll('.nav-cat').forEach(c => c.classList.remove('active'));
  cat.classList.add('active');
  showToast('分类：' + cat.textContent);
});

// ===== Toast =====
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 初始化 =====
renderHero();
renderGames();
</script>
</body>
</html>
